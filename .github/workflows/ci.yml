name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/index.js --version

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - run: npm run typecheck
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - name: Smoke test (launch the app headless)
        working-directory: desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            SWARMCODE_SMOKE_TEST=1 xvfb-run -a npx electron . --no-sandbox
          else
            SWARMCODE_SMOKE_TEST=1 npx electron .
          fi
